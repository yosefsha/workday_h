name: CI

# The gate that has to go red before a human is asked to read the diff:
# lint, migration and image build for the one service this repository ships.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # `gh workflow run ci.yml` needs the workflow to accept a manual trigger.
  workflow_dispatch:

# One in-flight run per branch. A new push supersedes the run it invalidated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Explicit `bash`, which GitHub runs as `bash -e -o pipefail`: a step fails on
# the first non-zero exit, and a failing command in a pipeline is not masked by
# a succeeding one after it.
defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend — ruff + migration
    runs-on: ubuntu-latest
    defaults:
      run:
        # The service lives in backend/; a run from the repo root finds nothing.
        working-directory: backend

    # Real Postgres, not a mock of one. Same image and the same health probe as
    # docker-compose.yml, so a migration that applies here applies locally too.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 10s

    env:
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the `python:3.12-slim` base in backend/Dockerfile.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install ruff
        # Pinned in the workflow rather than in requirements-dev.txt so the lint
        # gate cannot drift under the codebase when a new ruff relaxes or adds
        # a rule, and so the runtime dependency set stays untouched.
        run: pip install ruff==0.16.2

      - name: Lint (ruff)
        run: ruff check .

      - name: Migrate the database (alembic upgrade head)
        # Doubles as the check that the migration applies cleanly to an empty
        # database on every pull request.
        run: alembic upgrade head

      # There is no `pytest` step yet, deliberately: the suite is not written.
      # An empty run exits 5 and would leave this workflow permanently red, and
      # a placeholder test that asserts nothing is worse than an absent one.
      # docs/FUTURE-TASKS.md tracks restoring this gate with the suite.

  images:
    name: Images — docker build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build the backend image
        # Build context is backend/, matching docker-compose.yml. The image is
        # built, not pushed: this stage only proves the Dockerfile still builds.
        run: docker build --pull -t ${{ github.event.repository.name }}-backend:${{ github.sha }} backend
